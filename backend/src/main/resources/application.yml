spring:
  application:
    name: inmocheck-backend
  config:
    # En local, las variables salen de backend/.env (no se sube a git).
    # En Render no existe ese archivo: se usan las variables del entorno.
    import: optional:file:.env[.properties]
  datasource:
    # PostgreSQL de Supabase por el pooler de SESIÓN (IPv4, puerto 5432).
    # Toda consulta debe pasar por EjecutorRls; este usuario se salta RLS.
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER:}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      # El pooler de sesión de Supabase admite 15 conexiones EN TOTAL (entre
      # esta app, las pruebas y cualquier otra instancia). Máximo 5 aquí, y
      # solo 1 abierta mientras no haya trabajo.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      # Si la primera conexión falla (p. ej. un tropiezo de DNS al arrancar),
      # el pool sigue reintentando en segundo plano en vez de rendirse, y una
      # petición espera hasta 10 s a que haya conexión antes de dar error.
      initialization-fail-timeout: -1
      connection-timeout: 10000
  servlet:
    multipart:
      # Fotos: máximo 10 MB cada una (Limites.FOTO_TAMANO_MAXIMO_MB). La petición
      # completa admite un poco más por los separadores del formulario. Más que
      # eso responde 413 FILE_TOO_LARGE sin leer el archivo entero.
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      # Un campo desconocido en el JSON es un error (422), como .strict() de Zod.
      fail-on-unknown-properties: true
      # 2.5 habitaciones es un error, no 2 (como z.number().int()).
      accept-float-as-int: false
  web:
    # Los mensajes de validación que no traen texto propio salen en español,
    # también en el servidor (donde el sistema está en inglés).
    locale: es
    locale-resolver: fixed

inmocheck:
  supabase:
    # Si falta, la app no arranca (ver PropiedadesSupabase).
    url: ${SUPABASE_URL:}
    # Solo servidor. Salta RLS: se usa únicamente después de autorizar.
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  front:
    # Para los enlaces de los correos. Si falta, la app no arranca.
    url: ${FRONT_URL:}

server:
  # Render entrega el puerto en la variable PORT; en local es 8080
  # para no chocar con Next.js (3000).
  port: ${PORT:8080}

management:
  endpoints:
    web:
      # Solo la salud: Render la usa para saber si la app está viva.
      exposure:
        include: health
  endpoint:
    health:
      # Sin detalles: no se publica qué componentes tiene el servidor.
      show-details: never
  health:
    db:
      # La salud dice si ESTA app está viva. Si Supabase falla, reiniciar el
      # servidor no lo arregla, así que la base no cuenta para la salud.
      enabled: false
