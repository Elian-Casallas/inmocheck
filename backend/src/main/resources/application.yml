spring:
  application:
    name: inmocheck-backend
  config:
    # En local, las variables salen de backend/.env (no se sube a git).
    # En AWS no existe ese archivo: se usan las variables del entorno.
    import: optional:file:.env[.properties]

inmocheck:
  supabase:
    # Si falta, la app no arranca (ver PropiedadesSupabase).
    url: ${SUPABASE_URL:}

server:
  # Elastic Beanstalk entrega el puerto en la variable PORT; en local es 8080
  # para no chocar con Next.js (3000).
  port: ${PORT:8080}

management:
  endpoints:
    web:
      # Solo la salud: el balanceador de AWS la usa para saber si la app está viva.
      exposure:
        include: health
  endpoint:
    health:
      # Sin detalles: no se publica qué componentes tiene el servidor.
      show-details: never
